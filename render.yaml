# Render ya NO corre el backend: el backend y la base viven en la VPS de Hetzner
# (https://api.buschfranco.com, ver backend/README.md → "VPS").
#
# Este servicio queda como REENVÍO para las versiones de la app ya instaladas,
# que tienen grabada la URL de Render (API_BASE_URL es fija al compilar): pasa
# cada pedido tal cual a la VPS, sin tocar ninguna base. Cuando casi nadie use
# versiones viejas, se borra el servicio en Render y este archivo.
services:
  - type: web
    name: oneofone-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # El reenvío no tiene dependencias: no hace falta instalar ni compilar.
    buildCommand: echo "reenvío a la VPS, sin build"
    startCommand: node deploy/vps/render-proxy.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTREAM_URL
        value: https://api.buschfranco.com
